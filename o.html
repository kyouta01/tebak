<main style="padding:1.5rem;max-width:700px;margin:auto;">
  <h2>Fungsi</h2>
  <p>Menandai <strong>objek langsung</strong> dari sebuah kata kerja.</p>

  <h2>Contoh Kalimat</h2>
  <ul>
    <li>ごはん<strong>を</strong> たべます。<br><em>Gohan o tabemasu.</em> – Makan nasi.</li>
    <li>ほん<strong>を</strong> よみます。<br><em>Hon o yomimasu.</em> – Membaca buku.</li>
  </ul>

  <h2>Catatan</h2>
  <p>Ditulis dengan hiragana <strong>を</strong>, dibaca “o”.</p>
</main>
