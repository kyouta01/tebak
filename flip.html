<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanji Flip – 3 Stage</title>
  <link rel="stylesheet" href="asset/assetscss/flip.css">
</head>
<body>
  <div class="container">
    <h1>Kanji Flip – Memory Game</h1>

    <div class="controls">
      <label for="stageSelect">Pilih Stage:</label>
      <select id="stageSelect">
        <option value="1">Stage 1 – 8 kartu</option>
        <option value="2">Stage 2 – 16 kartu</option>
        <option value="3">Stage 3 – 32 kartu</option>
        <option value="4">Stage 4 – 64 kartu</option>
        <option value="5">Stage 5 – 128 kartu</option>
        <option value="6">Stage -1 – 256 kartu</option>
        <option value="7">Stage -2 – 500 kartu</option>
      </select>
      <button id="startBtn">Mulai / Ulang</button>
    </div>

    <div class="info">
      <span>Langkah: <strong id="moves">0</strong></span>
      <span>Waktu: <strong id="time">0</strong>s</span>
    </div>

    <div id="board" class="board"></div>

    <div id="result" class="result hidden">
      <p id="finalScore"></p>
      <button id="restartBtn">Main Lagi</button>
    </div>
  </div>

  <script src="asset/assetsjs/flip.js"></script>
</body>
</html>
