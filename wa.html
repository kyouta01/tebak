<header>
  <h1>Partikel は (wa)</h1>
  <a href="bunpomateri.html" class="home-box">⬅ Kembali ke Daftar Partikel</a>
</header>

<main style="padding:1.5rem;max-width:700px;margin:auto;">
  <h2>Fungsi</h2>
  <p>Partikel <strong>は (dibaca “wa”)</strong> menandai <em>topik</em> kalimat.</p>

  <h2>Contoh Kalimat</h2>
  <ul>
    <li>わたし<strong>は</strong> がくせいです。<br><em>Watashi wa gakusei desu.</em> – Saya seorang pelajar.</li>
    <li>にほん<strong>は</strong> きれいです。<br><em>Nihon wa kirei desu.</em> – Jepang itu indah.</li>
  </ul>

  <h2>Catatan</h2>
  <p>Meskipun ditulis “は”, dibaca “wa”.</p>
</main>
</body>
